# bmashup-sdk example (m), built from bm_gp_ai.c with GP_PACE=-1.0 (probe only).
id = "bmashup-sdk.ai-probe"
name = "SDK AI Probe"
version = "0.1.0"
description = "Logs every rival AI cap / target / speed / schedule every 2 s (bmashup.ai query). Changes nothing."

[bmashup]
platform = ">=0.1.4"
requires = ["bmashup.ai>=1"]

[plugin]
api = 1
windows = "bm_gp_ai.asi"
# Only Windows x64 is built and tested.
