# bmashup-sdk example (n), source = the host tree's crash-scores example (docs/services/CRASH_EVENTS_V6.md).
id = "bmashup-sdk.crash-scores"
name = "SDK Crash Scores"
version = "0.1.0"
description = "Private, experimental: logs every Crash result with its junction and keeps the session best; changes nothing."

[bmashup]
platform = ">=0.1.4"
requires = ["bmashup.events>=6", "bmashup.crash>=1"]

[plugin]
api = 1
windows = "bm_crash_scores.asi"
# Only Windows x64 is built and tested.
