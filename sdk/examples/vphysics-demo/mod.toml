# bmashup-sdk example (k), source = the p4.1 host tree's vphysics demo (docs/services/VPHYSICS.md). Approve its code on the MODS page.
id = "bmashup-sdk.vphysics-demo"
name = "SDK Vehicle Physics Demo"
version = "0.1.0"
description = "Private, experimental: player 1 drag halved in odd races, its own value in even races; logs speed twice a second."

[bmashup]
platform = ">=0.1.4"
requires = ["bmashup.vphysics>=1"]

[plugin]
api = 1
windows = "bm_vphysics_demo.asi"
# Only Windows x64 is built and tested.
