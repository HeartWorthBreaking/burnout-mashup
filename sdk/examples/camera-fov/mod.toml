# bmashup-sdk example (o), source = the gp camset1 slice plugin (docs/services/SETTINGS.md, CAMERA.md).
id = "bmashup-sdk.camera-fov"
name = "SDK Camera FOV"
version = "0.1.0"
description = "A CAMERA FOV setting (MOD SETTINGS) for the race camera: 70 to 140 percent, from the next race."

[bmashup]
platform = ">=0.1.4"
requires = ["bmashup.settings>=1", "bmashup.camera>=1"]

[plugin]
api = 1
windows = "bm_gp_camera_fov.asi"
# Only Windows x64 is built and tested.
