# bmashup-sdk example (l), built from bm_gp_traffic.c with GP_DENSITY=-1.0 (probe only).
id = "bmashup-sdk.traffic-probe"
name = "SDK Traffic Probe"
version = "0.1.0"
description = "Logs the traffic state every 2 s (bmashup.traffic query). Changes nothing."

[bmashup]
platform = ">=0.1.4"
requires = ["bmashup.traffic>=1"]

[plugin]
api = 1
windows = "bm_gp_traffic.asi"
# Only Windows x64 is built and tested.
