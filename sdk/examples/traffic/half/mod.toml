# bmashup-sdk example (l), built from bm_gp_traffic.c with GP_DENSITY=0.5 (docs/services/TRAFFIC.md).
id = "bmashup-sdk.traffic-half"
name = "SDK Half Traffic"
version = "0.1.0"
description = "Private, experimental: every race traffic flow x0.5 (bmashup.traffic density); logs the traffic count."

[bmashup]
platform = ">=0.1.4"
requires = ["bmashup.traffic>=1"]

[plugin]
api = 1
windows = "bm_gp_traffic.asi"
# Only Windows x64 is built and tested.
