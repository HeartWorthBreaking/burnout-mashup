# p4.3 combined acceptance: a NEW series (veh1) with the AUTHORED carimport coupe and its AUTHORED garage photo (fetex1).
# Model files: carimport-coupe's (AUTHORED geometry + DERIVED donor parts): LOCAL ONLY, never upload. See LABELS.txt.
id = "bmashup.p43-coupe-series"
name = "BM Coupes series (p4.3)"
version = "1.0.0"
description = "New series BM Coupes: the authored BM Coupe (own model, own photo, registered paints) + three AI cars."

[bmashup]
platform = ">=0.1.6"
requires = ["bmashup.textures>=1"]
requires_mods = ["bmashup.p43-coupe-photo >= 1.0"]

[bmashup.series]
version = 1
add = ["coupes = BMCO"]
names = ["coupes = BM Coupes"]
ai_class = ["coupes = CUPE"]

[bmashup.cars]
version = 2
add = ["BMCOCIC1 = COMPCAR1", "BMCOC02 = CUPECAR1", "BMCOC03 = CUPECAR2", "BMCOC04 = SPRTCAR1"]
names = ["BMCOCIC1 = BM Coupe", "BMCOC02 = Coupe Rival A", "BMCOC03 = Coupe Rival B", "BMCOC04 = Coupe Rival C"]
model = ["BMCOC02 = donor", "BMCOC03 = donor", "BMCOC04 = donor"]
ai = ["BMCOCIC1", "BMCOC02", "BMCOC03", "BMCOC04"]
photos = ["BMCOCIC1 = bmashup.p43-coupe-photo/bmcocic1_photo"]

[bmashup.paints]
version = 1
add = ["crimson = BMCOCIC1 | ramp E02040 300008", "gold = BMCOCIC1 | ramp FFD040 403000"]
